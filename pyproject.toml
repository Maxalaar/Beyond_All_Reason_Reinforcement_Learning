[project]
name = "beyond-all-reason-reinforcement-learning"
version = "0.1.0"
description = "Agents trained on Beyond All Reason with Maxalaar_Reinforcement_Learning (Ray RLlib)"
requires-python = ">=3.11"
dependencies = [
    "beyond-all-reason-environment @ git+https://github.com/Maxalaar/Beyond_All_Reason_Environment.git",
    "maxalaar-reinforcement-learning @ git+https://github.com/Maxalaar/Maxalaar_Reinforcement_Learning.git",
    "ray[rllib]==2.54.0",
    "torch",
]

[project.optional-dependencies]
# pip install -e ".[development]"
development = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
